services:
  resume-tailor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_tailor_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GEMINI_REASONING_API_KEY=${GEMINI_REASONING_API_KEY:-}
      - GEMINI_REASONING_MODEL=${GEMINI_REASONING_MODEL:-gemini-2.5-pro}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-3-5-sonnet-20241022}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - MASTER_RESUME_PATH=/app/data/master/Manbir-OPS-Resume.md
      - PROJECTS_DIR=/app/data/projects
      - OUTPUT_DIR=/app/data/output
      - STATIC_DIR=/app/frontend/static
    volumes:
      # Mandatory Invariance Protection: Master Resume and Projects mounted READ-ONLY (:ro)
      - ./data/master:/app/data/master:ro
      - ./data/projects:/app/data/projects:ro
      # Output directory mounted read-write for exported resumes & PDFs
      - ./data/output:/app/data/output:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
